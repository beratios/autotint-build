{% macro bowtie(w='16vmin', c='var(--acc)') %}<svg style="width:{{w}}" viewBox="0 0 120 50"><path d="M60 25 L8 4 Q2 2 2 9 V41 Q2 48 8 46 Z" fill="{{c}}"/><path d="M60 25 L112 4 Q118 2 118 9 V41 Q118 48 112 46 Z" fill="{{c}}"/><path d="M60 25 L18 12 V38Z M60 25 L102 12 V38Z" fill="#000" opacity=".18"/><rect x="50" y="15" width="20" height="20" rx="5" fill="{{c}}" stroke="#000" stroke-opacity=".25"/></svg>{% endmacro %}
{% macro coupes(w='26vmin', c='var(--acc)') %}<svg style="width:{{w}}" viewBox="0 0 160 90" fill="none" stroke="{{c}}" stroke-width="2.2" stroke-linecap="round"><g transform="rotate(-14 55 60)"><path d="M25 22 Q55 52 85 22Z" fill="{{c}}" fill-opacity=".25"/><path d="M25 22 H85"/><path d="M55 44 V80 M40 82 H70"/></g><g transform="rotate(14 105 60)"><path d="M75 22 Q105 52 135 22Z" fill="{{c}}" fill-opacity=".25"/><path d="M75 22 H135"/><path d="M105 44 V80 M90 82 H120"/></g>{% for x,y in [(80,6),(70,12),(92,10),(80,-2)] %}<circle cx="{{x}}" cy="{{y+6}}" r="1.6" fill="{{c}}"/>{% endfor %}<path d="M80 0 v8 M76 4 h8"/></svg>{% endmacro %}
{% macro baubles(c1='#d6b46a', c2='#f3e3a8') %}<div style="position:fixed;left:0;right:0;top:0;height:40vmin;pointer-events:none">
{% for x,len,r,c in [(12,14,4.2,c1),(20,24,3.2,c2),(80,22,3.6,c2),(88,12,4.6,c1)] %}
<div style="position:absolute;left:{{x}}%;top:5.6vmin;width:0;height:{{len}}vmin;border-left:1px solid {{c1}}"></div>
<div style="position:absolute;left:calc({{x}}% - {{r}}vmin);top:{{5.6+len}}vmin;width:{{2*r}}vmin;height:{{2*r}}vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d6 0,{{c}} 25%,#8a6a2c 85%);box-shadow:0 0 2vmin rgba(214,180,106,.35)"></div>
<div style="position:absolute;left:calc({{x}}% - .9vmin);top:{{4.8+len}}vmin;width:1.8vmin;height:1.2vmin;background:#c9a65c;border-radius:.2vmin"></div>{% endfor %}</div>{% endmacro %}
