{% macro star(x,y,r,c) %}<path transform="translate({{x}} {{y}})" d="M0 -{{r}} L{{r*0.22}} -{{r*0.22}} L{{r}} 0 L{{r*0.22}} {{r*0.22}} L0 {{r}} L-{{r*0.22}} {{r*0.22}} L-{{r}} 0 L-{{r*0.22}} -{{r*0.22}}Z" fill="{{c}}"/>{% endmacro %}
{% macro cookie(x,y,s) %}<g transform="translate({{x}} {{y}}) scale({{s}})"><circle r="30" fill="#d99a4e"/><circle r="30" fill="none" stroke="#b5742f" stroke-width="3"/>{% for cx,cy in [(-12,-10),(10,-14),(4,6),(-14,12),(16,10)] %}<ellipse cx="{{cx}}" cy="{{cy}}" rx="4.5" ry="3.5" fill="#5a3420"/>{% endfor %}</g>{% endmacro %}
{% macro ginger(x,y,s) %}<g transform="translate({{x}} {{y}}) scale({{s}})" fill="#c47a3a"><circle cx="0" cy="-30" r="15"/><rect x="-14" y="-18" width="28" height="36" rx="10"/><rect x="-36" y="-14" width="30" height="12" rx="6" transform="rotate(-15 -14 -8)"/><rect x="6" y="-14" width="30" height="12" rx="6" transform="rotate(15 14 -8)"/><rect x="-16" y="10" width="12" height="32" rx="6" transform="rotate(12 -10 12)"/><rect x="4" y="10" width="12" height="32" rx="6" transform="rotate(-12 10 12)"/><circle cx="-5" cy="-32" r="2.2" fill="#3d2a1e"/><circle cx="5" cy="-32" r="2.2" fill="#3d2a1e"/><path d="M-6 -25 q6 5 12 0" stroke="#fff" stroke-width="1.8" fill="none"/>{% for yy in [-8,2,12] %}<circle cx="0" cy="{{yy}}" r="2.8" fill="#e2463f"/>{% endfor %}<path d="M-30 -12 l4 4 M30 -12 l-4 4" stroke="#fff" stroke-width="1.5"/></g>{% endmacro %}
