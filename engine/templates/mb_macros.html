{% macro flute(w, fill='#f7a23b', top='#ffd27a') %}<svg width="{{w}}" viewBox="0 0 60 130"><path d="M14 4 L46 4 L42 66 Q30 76 18 66Z" fill="rgba(255,255,255,.55)" stroke="#c9b6a4" stroke-width="2"/><path d="M15 22 L45 22 L42 66 Q30 76 18 66Z" fill="{{fill}}"/><path d="M15 22 L45 22" stroke="{{top}}" stroke-width="3"/>{% for b in range(5) %}<circle cx="{{ 24 + (b%3)*6 }}" cy="{{ 60 - b*8 }}" r="1.6" fill="#fff" opacity=".85"/>{% endfor %}<rect x="28.4" y="72" width="3.2" height="46" fill="#d6c6b6"/><ellipse cx="30" cy="120" rx="15" ry="4" fill="#d6c6b6"/><g transform="translate(44 8)"><circle r="10" fill="{{fill}}"/><circle r="7.6" fill="{{top}}"/>{% for a in range(0,360,60) %}<line x1="0" y1="0" x2="{{ 7*cos(a) }}" y2="{{ 7*sin(a) }}" stroke="{{fill}}" stroke-width="1"/>{% endfor %}</g></svg>{% endmacro %}
{% macro fruit(w, c) %}<svg width="{{w}}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="{{c}}"/><circle cx="20" cy="20" r="14.5" fill="#fff" opacity=".45"/><circle cx="20" cy="20" r="13" fill="{{c}}" opacity=".85"/>{% for a in range(0,360,45) %}<line x1="20" y1="20" x2="{{ 20 + 12*cos(a) }}" y2="{{ 20 + 12*sin(a) }}" stroke="#fff" stroke-width="1.1" opacity=".8"/>{% endfor %}<circle cx="20" cy="20" r="2" fill="#fff"/></svg>{% endmacro %}
