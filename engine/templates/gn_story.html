{% extends theme %}
{% block mode %}story{% endblock %}
{% block content %}
<div class="t-k" style="font-size:3.2vmin;letter-spacing:.3em;text-transform:uppercase">you are invited to</div>
<div class="t-h" style="font-size:15vmin;line-height:.95;margin-top:3vmin">{{ title }}</div>
<div class="t-s" style="font-size:9vmin;margin-top:1.4vmin">at the {{ family }}s</div>
<div class="t-rule"></div>
<div class="t-b" style="font-size:5.6vmin;font-weight:500">{{ date }}</div><div class="t-b" style="font-size:5.6vmin;font-weight:500">{{ time }}</div>
<div class="t-b" style="font-size:4.4vmin;margin-top:4vmin;color:var(--gn-muted,#4e6a96)">{{ game_names|join(' · ')|lower }}</div>
<div class="t-k" style="font-size:4vmin;margin-top:4vmin">{{ story_line|default('bring your best elf energy!') }}</div>
{% endblock %}
